name: Testes da API de funcionarios
on:
  push:
    branches: [main]
    paths: ['crud-ads/**', '.github/workflows/funcionarios.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: crud-ads/pom.xml
      - name: Compilar e testar acesso HTTP
        run: mvn -B -f crud-ads/pom.xml clean verify
